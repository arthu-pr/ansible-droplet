---
- name: Ensure sudo group is present
  ansible.builtin.group:
    name: sudo
    state: present

- name: Ensure sudo group has sudo privileges
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: ^%sudo
    line: '%sudo ALL=(ALL:ALL) ALL'
    validate: /usr/sbin/visudo -cf %s

- name: Create default user
  ansible.builtin.user:
    name: '{{ username }}'
    groups: sudo
    password: "{{ password | password_hash('sha512') }}"
    shell: /bin/bash
    update_password: always
    state: present
  register: created_user

- name: Add authorized key
  ansible.posix.authorized_key:
    user: '{{ username }}'
    key: "{{ lookup('file', ansible_ssh_public_key) }}"

# Path must be absolute: these tasks run under `become: true`, so a leading
# `~` would expand to root's home and drop the key in /root/.ssh instead.
- name: Generate SSH key
  community.crypto.openssh_keypair:
    path: '{{ created_user.home }}/.ssh/id_ssh_rsa'
    owner: '{{ username }}'
    group: '{{ username }}'
